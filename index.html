<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AQUALOQA Coming Soon</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="splash" aria-label="AQUALOQA coming soon splash page">
      <section class="stage" aria-label="Beach video preview">
        <div class="video-frame">
          <div class="video-mask">
            <video
              class="hero-video"
              data-default-src="./assets/video-repeat.mp4"
              data-tablet-src="./assets/video-repeat.mp4"
              data-mobile-src="./assets/video-mobile.mp4"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
              aria-label="Looping ocean shoreline video"
            ></video>
          </div>
          <button class="sound-toggle" type="button" aria-label="Unmute video" aria-pressed="false">
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5v5h3.2L12 19V5L7.2 9.5H4Z"></path>
              <path d="m16 9 5 5m0-5-5 5"></path>
            </svg>
            <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5v5h3.2L12 19V5L7.2 9.5H4Z"></path>
              <path d="M16 8.2a5.4 5.4 0 0 1 0 7.6"></path>
              <path d="M18.8 5.5a9.4 9.4 0 0 1 0 13"></path>
            </svg>
          </button>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
