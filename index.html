<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AQUALOQA Coming Soon</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="splash" aria-label="AQUALOQA coming soon splash page">
      <section class="stage" aria-label="Beach video preview">
        <div class="video-frame">
          <div class="video-mask">
            <video
              class="hero-video"
              data-default-src="./assets/video-repeat.mp4"
              data-tablet-src="./assets/video-repeat.mp4"
              data-mobile-src="./assets/video-mobile.mp4"
              autoplay
              loop
              playsinline
              preload="auto"
              aria-label="Looping ocean shoreline video"
            ></video>
          </div>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
